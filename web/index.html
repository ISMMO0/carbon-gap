<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbon Gap</title>
<meta name="description" content="Declared vs observed greenhouse-gas emissions, country by country, priced at the cost of carbon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch-gap" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#F2D6CF"/><line x1="0" y1="0" x2="0" y2="5" stroke="#A3362E" stroke-width="2"/>
    </pattern>
    <pattern id="hatch-neg" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-45)">
      <rect width="5" height="5" fill="#DCE9E0"/><line x1="0" y1="0" x2="0" y2="5" stroke="#3B7653" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatch-nodecl" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#DDDAD0"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8C8A80" stroke-width="1.2"/>
    </pattern>
  </defs>
</svg>

<div class="app">
  <header class="bar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="bm-clip"><circle cx="16" cy="16" r="13"/></clipPath><pattern id="bm-hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="3" fill="#F0D68A"/><line y2="3" stroke="#B6463B" stroke-width="1.6"/></pattern></defs><g clip-path="url(#bm-clip)"><rect width="32" height="32" fill="#2B3C36"/><rect y="10" width="18" height="5" fill="#EEF0EA"/><rect y="17" width="18" height="5" fill="#EEF0EA"/><rect x="18" y="17" width="9" height="5" fill="url(#bm-hatch)"/></g><circle cx="16" cy="16" r="13" fill="none" stroke="#EEF0EA" stroke-width="1.8"/></svg>
      Carbon Gap
    </div>
    <nav class="tabs" aria-label="Main">
      <button class="tab" data-view="gap" aria-current="page"><i data-lucide="globe-2" class="icon"></i>Countries</button>
      <button class="tab" data-view="companies"><i data-lucide="building-2" class="icon"></i>Companies</button>
      <button class="tab" data-view="market"><i data-lucide="arrow-left-right" class="icon"></i>Carbon market</button>
    </nav>
    <button class="talk-btn" id="talk" aria-label="Talk to Carbon Gap" title="Talk to Carbon Gap (voice)"><i data-lucide="mic" class="icon"></i>Talk</button>
    <label class="bar-search"><i data-lucide="search" class="icon"></i>
      <input id="search" list="countries" placeholder="Search a country or any company" autocomplete="off" aria-label="Search a country or any company">
      <datalist id="countries"></datalist>
    </label>
  </header>

  <div class="main">

    <div class="stage" id="stage">
      <svg id="globe" role="img" aria-label="Globe coloured by emissions gap"></svg>
      <div class="stage-msg" id="stage-msg">Loading the map…</div>
      <div class="map-ctrl">
        <button id="zin" aria-label="Zoom in"><i data-lucide="plus" class="icon"></i></button>
        <button id="zout" aria-label="Zoom out"><i data-lucide="minus" class="icon"></i></button>
        <button id="zreset" aria-label="Reset view"><i data-lucide="rotate-ccw" class="icon"></i></button>
      </div>
      <div class="legend" id="legend"></div>
      <section class="sat" id="sat" hidden aria-label="Site seen from space"></section>
      <section class="swarm" id="swarm" hidden aria-label="Research agents"></section>

      <section class="hero" id="hero" aria-label="Introduction">
        <p class="hero-k">Declared vs observed greenhouse-gas emissions</p>
        <h1 id="hero-h">Countries declare less than satellites see.</h1>
        <p id="hero-p"></p>
        <div class="hero-actions">
          <button class="btn" id="hero-tour"><i data-lucide="play" class="icon"></i>Take the 60-second tour</button>
          <button class="btn ghost" id="hero-close">Explore the map</button>
        </div>
      </section>

      <section class="analyst" id="analyst" aria-label="Analyst">
        <header>
          <i data-lucide="message-square-text" class="icon"></i><b>Analyst</b><small>GPT-5.5 · moves the map</small>
          <button id="amin" aria-label="Minimise analyst"><i data-lucide="chevron-down" class="icon"></i></button>
        </header>
        <div class="log" id="log" aria-live="polite"></div>
        <div class="sugg" id="sugg"></div>
        <form id="ask">
          <input id="q" placeholder="Ask about a country, company or market  ( / )" autocomplete="off" aria-label="Ask the analyst">
          <button class="btn icon-only" aria-label="Send"><i data-lucide="arrow-up" class="icon"></i></button>
        </form>
      </section>

      <section class="voice" id="voice" aria-label="Voice conversation" hidden>
        <button class="voice-close" id="vclose" aria-label="End voice conversation"><i data-lucide="x" class="icon"></i></button>
        <button class="orb" id="orb" aria-label="Tap to talk"><canvas id="orbc" width="240" height="240"></canvas></button>
        <div class="voice-state" id="vstate">Tap to talk</div>
        <p class="voice-you" id="vyou"></p>
        <p class="voice-ai" id="vai"></p>
        <div class="voice-tools" id="vtools"></div>
      </section>

      <div class="report" id="report" aria-label="Report"></div>
    </div>

    <aside class="sheet" id="sheet" aria-live="polite"></aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<script src="voice.js"></script>
</body>
</html>
