<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carbon Gap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECEBE4; --sheet:#F8F7F3; --sheet-2:#F1F0EA; --ink:#1C2320; --ink-2:#47514D; --ink-3:#646E6A;
  --rule:#D6D3C8; --rule-2:#BEBAAD;
  --shell:#1F2D28; --shell-2:#2B3C36; --shell-ink:#EEF0EA; --shell-ink-2:#AEBBB5;
  --sea:#D8E1DF; --sea-line:#C3CFCC; --land-line:#8C8A80;
  --g0:#E8E5CC; --g1:#F0D68A; --g2:#E8AE62; --g3:#D77C4E; --g4:#B6463B; --g5:#7D2A35; --neg:#B4CBBD;
  --blue:#1E5A86; --blue-soft:#DCE7EF;
  --crit:#A3362E; --ok:#3B7653;
  --font:"Barlow",system-ui,sans-serif; --cond:"Barlow Condensed","Barlow",system-ui,sans-serif;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--g1);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.icon{width:16px;height:16px;flex:none}
*{scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-rows:52px 1fr;height:100vh}
.bar{background:var(--shell);color:var(--shell-ink);display:flex;align-items:center;gap:20px;padding:0 16px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font:700 19px/1 var(--cond);letter-spacing:.01em;white-space:nowrap}
.brand-mark{width:22px;height:22px}
.tabs{display:flex;gap:2px;height:100%}
.tab{display:flex;align-items:center;gap:6px;padding:0 12px;background:none;border:0;border-bottom:2px solid transparent;color:var(--shell-ink-2);font-weight:500;cursor:pointer}
.tab:hover{color:var(--shell-ink)}
.tab[aria-current="page"]{color:var(--shell-ink);border-bottom-color:var(--g1)}
.tab .soon{font:600 11px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--shell-ink-2);border:1px solid var(--shell-2);border-radius:3px;padding:2px 4px}
.bar-search{margin-left:auto;position:relative;display:flex;align-items:center}
.bar-search .icon{position:absolute;left:10px;color:var(--shell-ink-2)}
.bar-search input{width:240px;height:32px;border-radius:var(--r);border:1px solid var(--shell-2);background:var(--shell-2);color:var(--shell-ink);padding:0 10px 0 32px}
.bar-search input::placeholder{color:var(--shell-ink-2)}
.flag{display:flex;align-items:center;gap:6px;font:600 12px/1 var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--g1);border:1px solid #6B5B2E;border-radius:3px;padding:6px 8px;white-space:nowrap}

.main{display:grid;grid-template-columns:240px minmax(0,1fr) 420px;min-height:0}

/* ---------- left rail ---------- */
.rail{background:var(--sheet);border-right:1px solid var(--rule);overflow:auto;padding:16px 16px 24px}
.rail h2,.sheet h3,.report h3{font:600 13px/1.2 var(--cond);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px}
.rail section+section{margin-top:22px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:7px 0;font-weight:500;font-size:14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.field{display:flex;flex-direction:column;gap:6px}
.field select{height:34px;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--sheet);padding:0 8px}
.sector{display:flex;align-items:center;gap:10px;padding:6px 6px;margin:0 -6px;border-radius:var(--r);cursor:pointer}
.sector:hover{background:var(--sheet-2)}
.sector input{position:absolute;opacity:0;pointer-events:none}
.sector .sw{width:18px;height:14px;border:1px solid var(--ink);flex:none}
.sector .name{flex:1}
.sector .chk{width:16px;height:16px;border:1.5px solid var(--ink-2);border-radius:3px;display:grid;place-items:center;flex:none}
.sector input:checked~.chk{background:var(--ink);border-color:var(--ink)}
.sector input:checked~.chk::after{content:"";width:8px;height:4px;border:2px solid var(--sheet);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.sector input:not(:checked)~.sw{opacity:.3}
.sector input:not(:checked)~.name{color:var(--ink-3)}
.sector input:focus-visible~.chk{outline:2px solid var(--blue);outline-offset:2px}
.rail .note{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.keyrow{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:6px}
.keyrow .sw{width:18px;height:14px;border:1px solid var(--ink);flex:none}

/* ---------- map ---------- */
.stage{position:relative;min-width:0;overflow:hidden;background:var(--paper)}
#globe{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#globe:active{cursor:grabbing}
.country{stroke:var(--land-line);stroke-width:.5;cursor:pointer;transition:fill .25s}
.country:hover{stroke:var(--ink);stroke-width:1}
.hl{fill:none;stroke:var(--ink);stroke-width:1.8;pointer-events:none}
.sel{fill:none;stroke:var(--blue);stroke-width:2.4;pointer-events:none}
.glabel{font:600 13px/1 var(--cond);letter-spacing:.03em;fill:var(--ink);paint-order:stroke;stroke:var(--sheet);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none;text-transform:uppercase}
.site{stroke:var(--ink);stroke-width:1;cursor:pointer}
.site.on{stroke:var(--blue);stroke-width:2.5}
.stage-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-weight:500}
.map-ctrl{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;border:1px solid var(--rule-2);border-radius:var(--r);background:var(--sheet);overflow:hidden}
.map-ctrl button{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;cursor:pointer;color:var(--ink-2)}
.map-ctrl button:hover{background:var(--sheet-2);color:var(--ink)}
.map-ctrl button+button{border-top:1px solid var(--rule)}
.legend{position:absolute;left:14px;bottom:14px;background:var(--sheet);border:1px solid var(--ink);padding:10px 12px 10px;min-width:250px}
.legend h4{margin:0 0 8px;font:600 13px/1.1 var(--cond);letter-spacing:.06em;text-transform:uppercase}
.legend .ramp{display:flex}
.legend .ramp span{flex:1;height:12px;border:1px solid var(--ink);border-right:0}
.legend .ramp span:last-child{border-right:1px solid var(--ink)}
.legend .ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:3px}
.legend .conf{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend .conf .sw{width:18px;height:12px;border:1px solid var(--ink)}

/* ---------- analyst ---------- */
.analyst{position:absolute;right:14px;bottom:14px;width:min(380px,calc(100% - 28px));max-height:calc(100% - 28px);display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule-2);border-radius:6px;box-shadow:0 10px 30px -12px rgba(28,35,32,.35)}
.analyst header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.analyst header b{font:700 15px/1 var(--cond);letter-spacing:.02em;text-transform:uppercase}
.analyst header small{color:var(--ink-3);font-size:12px}
.analyst header button{margin-left:auto;border:0;background:none;padding:4px;cursor:pointer;color:var(--ink-2);display:grid;place-items:center;border-radius:3px}
.analyst header button:hover{background:var(--sheet-2)}
.analyst.min .log,.analyst.min .sugg,.analyst.min form{display:none}
.analyst.min header{border-bottom:0}
.log{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px;max-height:340px}
.msg{font-size:14px;line-height:1.45;max-width:92%}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--sheet);padding:7px 10px;border-radius:6px 6px 2px 6px}
.msg.ai{align-self:flex-start}
.msg.ai p{margin:0 0 6px}.msg.ai p:last-child{margin:0}
.msg.ai ol,.msg.ai ul{margin:4px 0 6px;padding-left:18px}
.msg.ai .cite{font-size:12px;color:var(--ink-3)}
.tool{display:flex;align-items:center;gap:6px;font:500 12.5px/1 var(--font);color:var(--blue);background:var(--blue-soft);border-radius:3px;padding:5px 7px;align-self:flex-start}
.tool code{font:inherit;font-weight:600}
.thinking{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.sugg button{border:1px solid var(--rule-2);background:var(--sheet);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.sugg button:hover{border-color:var(--ink);color:var(--ink)}
.analyst form{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--rule)}
.analyst input{flex:1;height:36px;border:1px solid var(--rule-2);border-radius:var(--r);padding:0 10px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--ink);background:var(--ink);color:var(--sheet);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:#000}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--sheet-2)}
.btn.icon-only{width:36px;padding:0}

/* ---------- sheet (right panel) ---------- */
.sheet{background:var(--sheet);border-left:1px solid var(--rule);overflow:auto}
.sheet-head{padding:18px 20px 14px;border-bottom:1px solid var(--rule)}
.sheet-head .crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);margin-bottom:6px}
.sheet-head .crumb button{border:0;background:none;padding:0;color:var(--blue);cursor:pointer;font-size:13px}
.sheet-head h2{font:700 30px/1.05 var(--cond);margin:0;letter-spacing:.005em;text-wrap:balance}
.sheet-head .meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.pill .sw{width:14px;height:10px;border:1px solid var(--ink)}
.block{padding:16px 20px;border-bottom:1px solid var(--rule)}
.block:last-child{border-bottom:0}
.figs{display:grid;grid-template-columns:repeat(4,1fr);margin:12px 0 0;border-top:1px solid var(--rule)}
.figs div{padding:8px 0 0}
.figs dt{font-size:12px;color:var(--ink-3)}
.figs dd{margin:2px 0 0;font:600 19px/1.1 var(--font)}
.figs dd small{font-size:12px;font-weight:500;color:var(--ink-2)}
.figs .gap dd{color:var(--crit)}
.strata{display:block;width:100%;height:auto;overflow:visible}
.strata text{font:500 11.5px var(--font);fill:var(--ink-2)}
.strata .lbl{font:600 12px var(--cond);letter-spacing:.05em;text-transform:uppercase;fill:var(--ink)}
.secrow{display:grid;grid-template-columns:118px 1fr 64px;align-items:center;gap:10px;padding:5px 0}
.secrow .n{display:flex;align-items:center;gap:8px;font-size:14px}
.secrow .n .sw{width:12px;height:10px;border:1px solid var(--ink);flex:none}
.secrow .v{text-align:right;font-size:13px;font-weight:600}
.secrow .v.pos{color:var(--crit)} .secrow .v.neg{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:600 12px/1.2 var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);text-align:right;padding:0 0 6px;border-bottom:1px solid var(--ink)}
th:first-child,td:first-child{text-align:left}
th button{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
th button[aria-sort]::after{content:"";border:4px solid transparent;border-top-color:currentColor;margin-top:4px}
th button[aria-sort="ascending"]::after{border-top-color:transparent;border-bottom-color:currentColor;margin:-4px 0 0}
td{padding:7px 0;border-bottom:1px solid var(--rule);text-align:right;vertical-align:top}
td+td,th+th{padding-left:10px}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sheet-2)}
tbody tr.on td{background:var(--blue-soft)}
td .sub{display:block;font-size:12px;color:var(--ink-3)}
td .secdot{display:inline-block;width:9px;height:9px;border:1px solid var(--ink);margin-right:6px;vertical-align:1px}
.gpos{color:var(--crit);font-weight:600}.gneg{color:var(--ok);font-weight:600}
.cf{display:inline-flex;align-items:center;gap:5px;font-size:12.5px}
.cf .sw{width:12px;height:10px;border:1px solid var(--ink)}
.sources{margin:0;padding:0;list-style:none;font-size:13.5px}
.sources li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule)}
.sources li span:last-child{color:var(--ink-3);white-space:nowrap}
.actions{display:flex;gap:8px;padding:16px 20px;position:sticky;bottom:0;background:var(--sheet);border-top:1px solid var(--rule)}
.actions .btn{flex:1}
.lede{font-size:14px;color:var(--ink-2);margin:0}

/* ---------- report ---------- */
.report{position:absolute;inset:0;background:var(--paper);overflow:auto;z-index:5;display:none}
.report.open{display:block}
.report-tools{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--sheet);border-bottom:1px solid var(--rule);z-index:1}
.report-tools .t{font-weight:600;margin-right:auto}
.doc{max-width:820px;margin:24px auto 60px;background:#fff;border:1px solid var(--rule-2);padding:44px 52px}
.doc .titleblock{display:grid;grid-template-columns:1fr auto;gap:20px;border-bottom:2px solid var(--ink);padding-bottom:14px}
.doc h1{font:700 38px/1.02 var(--cond);margin:0;text-wrap:balance}
.doc .tb-meta{font-size:12.5px;color:var(--ink-2);text-align:right;line-height:1.6}
.doc h3{margin:28px 0 10px}
.doc p{max-width:68ch;margin:0 0 10px}
.doc .callout{border:1px solid var(--ink);padding:12px 14px;font-size:14px;margin-top:12px;background:var(--sheet)}
.steps{max-width:420px;margin:120px auto;list-style:none;padding:0}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--ink-3);border-bottom:1px solid var(--rule)}
.steps li.done{color:var(--ink)}
.steps li.now{color:var(--ink);font-weight:600}
.steps .dot{width:10px;height:10px;border:1.5px solid currentColor;border-radius:50%;flex:none}
.steps li.done .dot{background:var(--ink)}
.steps li.now .dot{animation:pulse 1s infinite;background:var(--g2)}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--sheet);padding:9px 14px;border-radius:var(--r);font-size:14px;transition:.25s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:1180px){
  .main{grid-template-columns:200px minmax(0,1fr) 360px}
  .figs{grid-template-columns:repeat(2,1fr);row-gap:6px}
}
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100vh}
  .main{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .stage{height:78vh}
  .sheet{border-left:0;overflow:visible}
  .tabs,.bar-search{display:none}
  .legend{min-width:0;right:14px;left:14px;bottom:auto;top:14px;left:62px}
  .report{position:fixed}
  .doc{padding:28px 20px;margin:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{overflow:visible;background:#fff}
  .bar,.rail,.stage>*:not(.report),.sheet,.report-tools{display:none!important}
  .main{display:block}.stage{overflow:visible}
  .report{position:static;display:block;background:#fff}
  .doc{border:0;margin:0;padding:0;max-width:none}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch-gap" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#F2D6CF"/><line x1="0" y1="0" x2="0" y2="5" stroke="#A3362E" stroke-width="2"/>
    </pattern>
    <pattern id="hatch-neg" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(-45)">
      <rect width="5" height="5" fill="#DCE9E0"/><line x1="0" y1="0" x2="0" y2="5" stroke="#3B7653" stroke-width="1.6"/>
    </pattern>
    <pattern id="hatch-conf" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1C2320" stroke-opacity=".45" stroke-width=".9"/>
    </pattern>
  </defs>
</svg>

<div class="app">
  <header class="bar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2.5 9h19M2.5 15h19"/><path d="M4 15h16v0" stroke="#F0D68A" stroke-width="3.2"/></svg>
      Carbon Gap
    </div>
    <nav class="tabs" aria-label="Main">
      <button class="tab" aria-current="page"><i data-lucide="globe-2" class="icon"></i>Map</button>
      <button class="tab" data-soon><i data-lucide="building-2" class="icon"></i>Companies <span class="soon">Soon</span></button>
      <button class="tab" data-soon><i data-lucide="file-text" class="icon"></i>Reports <span class="soon">Soon</span></button>
      <button class="tab" data-soon><i data-lucide="database" class="icon"></i>Sources <span class="soon">Soon</span></button>
    </nav>
    <label class="bar-search"><i data-lucide="search" class="icon"></i>
      <input id="search" list="countries" placeholder="Find a country" autocomplete="off" aria-label="Find a country">
      <datalist id="countries"></datalist>
    </label>
    <span class="flag" title="Every figure on this screen is invented for the mockup"><i data-lucide="flask-conical" class="icon"></i>Synthetic data</span>
  </header>

  <div class="main">
    <aside class="rail" aria-label="Map layers">
      <section>
        <h2>Colour countries by</h2>
        <div class="seg" role="group" aria-label="Metric">
          <button data-metric="gap" aria-pressed="true">Gap</button>
          <button data-metric="declared" aria-pressed="false">Declared</button>
          <button data-metric="observed" aria-pressed="false">Observed</button>
        </div>
        <p class="note" id="metric-note">Observed minus declared, as a share of what was declared.</p>
      </section>
      <section>
        <label class="field"><h2 style="margin:0">Inventory year</h2>
          <select id="year"><option>2025</option><option>2024</option><option>2023</option></select>
        </label>
      </section>
      <section>
        <h2>Sectors</h2>
        <div id="sectors"></div>
      </section>
      <section>
        <h2>Site symbols</h2>
        <div id="symbols"></div>
      </section>
    </aside>

    <div class="stage" id="stage">
      <svg id="globe" role="img" aria-label="Globe coloured by emissions gap"></svg>
      <div class="stage-msg" id="stage-msg">Loading the map…</div>
      <div class="map-ctrl">
        <button id="zin" aria-label="Zoom in"><i data-lucide="plus" class="icon"></i></button>
        <button id="zout" aria-label="Zoom out"><i data-lucide="minus" class="icon"></i></button>
        <button id="zreset" aria-label="Reset view"><i data-lucide="rotate-ccw" class="icon"></i></button>
      </div>
      <div class="legend" id="legend"></div>

      <section class="analyst" id="analyst" aria-label="Analyst">
        <header>
          <i data-lucide="message-square-text" class="icon"></i><b>Analyst</b><small>can move the map</small>
          <button id="amin" aria-label="Minimise analyst"><i data-lucide="chevron-down" class="icon"></i></button>
        </header>
        <div class="log" id="log" aria-live="polite"></div>
        <div class="sugg" id="sugg"></div>
        <form id="ask">
          <input id="q" placeholder="Ask about any country, sector or site" autocomplete="off" aria-label="Ask the analyst">
          <button class="btn icon-only" aria-label="Send"><i data-lucide="arrow-up" class="icon"></i></button>
        </form>
      </section>

      <div class="report" id="report" aria-label="Report"></div>
    </div>

    <aside class="sheet" id="sheet" aria-live="polite"></aside>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script>
/* =========================================================
   Carbon Gap — clickable mockup. ALL DATA IS SYNTHETIC.
   Country figures, site names and operators are invented.
   ========================================================= */
const PRICE = 72; // €/tCO2e, synthetic
const SECTORS = [
  {id:'power',     name:'Power',        color:'#5E9E8F', noun:'Power Station', sym:d3.symbolTriangle},
  {id:'steel',     name:'Iron & steel', color:'#D9533F', noun:'Steelworks',    sym:d3.symbolSquare},
  {id:'cement',    name:'Cement',       color:'#3E9DB8', noun:'Cement Works',  sym:d3.symbolDiamond},
  {id:'oil',       name:'Oil & gas',    color:'#86509A', noun:'Refinery',      sym:d3.symbolCircle},
  {id:'agri',      name:'Agriculture',  color:'#D8C24A', noun:'Agro Complex',  sym:d3.symbolCross},
  {id:'transport', name:'Transport',    color:'#79A957', noun:'Freight Hub',   sym:d3.symbolWye},
];
const SEC = Object.fromEntries(SECTORS.map(s=>[s.id,s]));
// [declared Mt, observed Mt, confidence] — invented values for the mockup
const TUNED = {
  'China':[11800,12900,'medium'],'United States of America':[5600,5920,'high'],'India':[2950,3420,'low'],
  'Russia':[1950,2380,'low'],'Japan':[1060,1088,'high'],'Indonesia':[690,862,'low'],'Iran':[720,851,'low'],
  'Germany':[640,668,'high'],'Saudi Arabia':[620,735,'low'],'South Korea':[600,624,'high'],'Canada':[560,598,'medium'],
  'Mexico':[470,516,'medium'],'Brazil':[480,561,'medium'],'South Africa':[430,492,'medium'],'Turkey':[420,452,'medium'],
  'Australia':[390,431,'medium'],'United Kingdom':[330,337,'high'],'Poland':[300,359,'medium'],'Italy':[310,322,'high'],
  'France':[290,301,'high'],'Kazakhstan':[260,318,'low'],'Spain':[220,229,'high'],'Ukraine':[170,206,'low'],
  'Egypt':[250,284,'low'],'Vietnam':[330,372,'low'],'Thailand':[260,281,'medium'],'Pakistan':[230,262,'low'],
  'Algeria':[180,214,'low'],'Nigeria':[130,163,'low'],'Argentina':[190,203,'medium'],'Norway':[42,41.2,'high'],
  'Sweden':[38,37.6,'high'],'Netherlands':[150,154,'high'],'Belgium':[98,101,'high'],'Czechia':[100,111,'medium'],
};
const PLACES = ['Hollen','Marrow Ridge','Castell','Brennan Flats','Osterby','Valdera','Kessring','Lune Bay','Aldane','Corvin','Halvard','Sorrento Plain','Ivel','Dunmere','Rask','Tamberly','Orlo','Wexden','Saltmarsh','Grevholm','Pellan','Arcas','Norrow','Belcourt'];
const OPERATORS = {power:['Northline Energy','Brightwater Power','Calder Group'],steel:['Orsk Metals','Ardent Materials','Vantor Industries'],cement:['Halden Cement','Ardent Materials','Stellan Holdings'],oil:['Meridian Fuels','Tessaly Petroleum','Stellan Holdings'],agri:['Fennic Agro','Calder Group','Greyfield Farms'],transport:['Kestrel Logistics','Vantor Industries','Norrow Freight']};
const SOURCES = [
  ['National inventory submission (declared)','annual'],
  ['EU ETS verified emissions (declared, per site)','annual'],
  ['Asset-level estimates, Climate TRACE (observed)','monthly'],
  ['Sentinel-5P NO₂ / CH₄ columns (observed proxy)','daily'],
  ['Grid operator generation data (observed, power)','hourly'],
];
const YEAR_F = {2025:1, 2024:.985, 2023:.972};

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const fmtMt = v=>Math.abs(v)>=100?d3.format(',.0f')(v):Math.abs(v)>=10?d3.format('.1f')(v):d3.format('.2f')(v);
const fmtPct = v=>(v>=0?'+':'−')+d3.format('.1f')(Math.abs(v*100))+'%';
const fmtEur = mt=>{const e=Math.abs(mt)*1e6*PRICE; const s=mt<0?'−':''; return e>=1e9?`${s}€${d3.format('.2f')(e/1e9)} bn`:`${s}€${d3.format('.0f')(e/1e6)} m`};
const confLabel = c=>({high:'High',medium:'Medium',low:'Low'})[c];
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200)}
function icons(){lucide.createIcons({attrs:{'stroke-width':1.75}})}

/* ---------- state ---------- */
const state = {metric:'gap', year:2025, sectors:new Set(SECTORS.map(s=>s.id)), selected:null, highlight:new Set(), siteLayer:null, activeSite:null, sort:{key:'gap',dir:-1}};
const data = new Map();

function buildData(features){
  for(const f of features){
    const n=f.properties.name, r=rng(hash(n));
    let d,o,c;
    if(TUNED[n]) [d,o,c]=TUNED[n];
    else { d=Math.max(1.2, d3.geoArea(f)*3200*(.35+r()*1.3)); o=d*(.975+r()*.17); const x=r(); c=x<.45?'low':x<.8?'medium':'high'; }
    const w=SECTORS.map(()=>.15+r()); const ws=d3.sum(w);
    const secs=SECTORS.map((s,i)=>{const sd=d*w[i]/ws; return {id:s.id, declared:sd, observed:sd*(1+(o/d-1)*(.2+r()*1.8))}});
    const os=d3.sum(secs,x=>x.observed); secs.forEach(x=>x.observed*=o/os);
    data.set(n,{name:n, declared:d, observed:o, conf:c, sectors:secs, feature:f, sites:null});
  }
}
function agg(rec){
  const yf=YEAR_F[state.year], ss=rec.sectors.filter(s=>state.sectors.has(s.id));
  const d=d3.sum(ss,s=>s.declared)*yf, o=d3.sum(ss,s=>s.observed)*yf;
  return {d,o,gap:o-d,pct:d?(o-d)/d:0};
}
function sitesOf(rec){
  if(rec.sites) return rec.sites;
  const r=rng(hash(rec.name+'#sites')), f=rec.feature, c=d3.geoCentroid(f);
  const [[x0,y0],[x1,y1]]=d3.geoBounds(f);
  const n=Math.max(4,Math.min(9,Math.round(Math.log(rec.declared)*1.4)));
  const used=new Set(), out=[];
  for(let i=0;i<n;i++){
    const s=rec.sectors[Math.floor(r()*rec.sectors.length)];
    let p=c; for(let k=0;k<30;k++){const q=[x0+(x1-x0)*r(), y0+(y1-y0)*r()]; if(x1-x0<180 && d3.geoContains(f,q)){p=q;break}}
    let place; do{place=PLACES[Math.floor(r()*PLACES.length)]}while(used.has(place)&&used.size<PLACES.length); used.add(place);
    const share=.06+r()*.22, dec=s.declared*share, bias=(s.observed/s.declared-1)*(.3+r()*1.3)+(r()-.5)*.04;
    out.push({id:rec.name+i, name:`${place} ${SEC[s.id].noun}`, operator:OPERATORS[s.id][Math.floor(r()*3)], sector:s.id, declared:dec, observed:dec*(1+bias), conf:r()<.4?'low':r()<.7?'medium':'high', coord:p, country:rec.name});
  }
  return rec.sites=out;
}
function siteVals(s){const yf=YEAR_F[state.year];return {d:s.declared*yf,o:s.observed*yf,gap:(s.observed-s.declared)*yf,pct:(s.observed-s.declared)/s.declared}}

/* ---------- colour ---------- */
const GAP_BREAKS=[0,.02,.05,.10,.15,.20];
const GAP_COLS=['var(--neg)','var(--g0)','var(--g1)','var(--g2)','var(--g3)','var(--g4)','var(--g5)'];
const TOT_COLS=['#EAE9DD','#CFD3BF','#A9B79C','#7F997C','#58775F','#36553F','#1E3628'];
const TOT_BREAKS=[10,30,100,300,1000,3000];
function colourOf(rec){
  const a=agg(rec);
  if(state.metric==='gap'){let i=0;while(i<GAP_BREAKS.length&&a.pct>=GAP_BREAKS[i])i++;return GAP_COLS[i]}
  const v=state.metric==='declared'?a.d:a.o; let i=0;while(i<TOT_BREAKS.length&&v>=TOT_BREAKS[i])i++;return TOT_COLS[i];
}
function renderLegend(){
  const g=state.metric==='gap';
  const cols=g?GAP_COLS:TOT_COLS, ticks=g?['<0','0','2%','5%','10%','15%','20%+']:['<10','10','30','100','300','1k','3k+'];
  $('#legend').innerHTML=`<h4>${g?'Emissions gap, observed vs declared':(state.metric==='declared'?'Declared':'Observed')+' emissions, MtCO₂e'}</h4>
    <div class="ramp">${cols.map(c=>`<span style="background:${c}"></span>`).join('')}</div>
    <div class="ticks">${ticks.map(t=>`<span>${t}</span>`).join('')}</div>
    <div class="conf"><svg class="sw" viewBox="0 0 18 12"><rect width="18" height="12" fill="var(--g1)"/><rect width="18" height="12" fill="url(#hatch-conf)"/></svg>Hatched: low confidence in the observed estimate</div>`;
  $('#metric-note').textContent={gap:'Observed minus declared, as a share of what was declared.',declared:'What the country reports in its national inventory.',observed:'Independent estimate from satellite and asset-level data.'}[state.metric];
}

/* ---------- globe ---------- */
const svg=d3.select('#globe');
const proj=d3.geoOrthographic().clipAngle(90).precision(.4);
const path=d3.geoPath(proj);
const grat=d3.geoGraticule10();
let base=300, W=800, H=600;
let gSea,gGrat,gC,gConf,gHl,gSel,gSites,gLab,gRim;

function initGlobe(){
  gSea=svg.append('path').datum({type:'Sphere'}).attr('fill','var(--sea)');
  gGrat=svg.append('path').datum(grat).attr('fill','none').attr('stroke','var(--sea-line)').attr('stroke-width',.6);
  gC=svg.append('g'); gConf=svg.append('g').attr('pointer-events','none');
  gHl=svg.append('g'); gSel=svg.append('g'); gSites=svg.append('g'); gLab=svg.append('g');
  gRim=svg.append('path').datum({type:'Sphere'}).attr('fill','none').attr('stroke','var(--ink)').attr('stroke-width',1.2);
  const feats=[...data.values()].map(r=>r.feature);
  gC.selectAll('path').data(feats).join('path').attr('class','country')
    .on('click',(e,f)=>selectCountry(f.properties.name,{fly:true}))
    .append('title').text(f=>f.properties.name);
  gConf.selectAll('path').data(feats.filter(f=>data.get(f.properties.name).conf==='low')).join('path').attr('fill','url(#hatch-conf)');
  svg.call(d3.drag().on('drag',e=>{const k=70/proj.scale(),r=proj.rotate();proj.rotate([r[0]+e.dx*k,Math.max(-85,Math.min(85,r[1]-e.dy*k)),r[2]]);draw()}));
  svg.node().addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.1:1/1.1,false)},{passive:false});
  resize(); proj.rotate([-12,-38,0]); recolour(); draw();
}
function resize(){
  const r=$('#stage').getBoundingClientRect(); if(r.width<10||r.height<10) return; W=r.width; H=r.height;
  const k0=gC?proj.scale()/base:1, k=isFinite(k0)&&k0>0?k0:1; base=Math.min(W,H)*.43;
  proj.translate([W*.42,H*.47]).scale(base*k); svg.attr('viewBox',`0 0 ${W} ${H}`); draw();
}
function visible(p){const r=proj.rotate();return d3.geoDistance(p,[-r[0],-r[1]])<Math.PI/2-.02}
function draw(){
  if(!gC) return;
  gSea.attr('d',path); gGrat.attr('d',path); gRim.attr('d',path);
  gC.selectAll('path').attr('d',path); gConf.selectAll('path').attr('d',path);
  const hl=[...state.highlight].filter(n=>data.has(n)).map(n=>data.get(n).feature);
  gHl.selectAll('path').data(hl,f=>f.properties.name).join('path').attr('class','hl').attr('d',path);
  const sel=state.selected?[data.get(state.selected).feature]:[];
  gSel.selectAll('path').data(sel).join('path').attr('class','sel').attr('d',path);
  const sites=(state.siteLayer||[]).filter(s=>state.sectors.has(s.sector)&&visible(s.coord));
  gSites.selectAll('path').data(sites,s=>s.id).join('path')
    .attr('class',s=>'site'+(s.id===state.activeSite?' on':''))
    .attr('fill',s=>SEC[s.sector].color)
    .attr('d',s=>d3.symbol(SEC[s.sector].sym, s.id===state.activeSite?150:70)())
    .attr('transform',s=>`translate(${proj(s.coord)})`)
    .on('click',(e,s)=>{e.stopPropagation();focusSite(s.id)})
    .selectAll('title').data(s=>[s]).join('title').text(s=>`${s.name} · ${s.operator}`);
  const labs=[...state.highlight].filter(n=>data.has(n)).map(n=>({n,c:d3.geoCentroid(data.get(n).feature)})).filter(l=>visible(l.c));
  gLab.selectAll('text').data(labs,l=>l.n).join('text').attr('class','glabel').attr('text-anchor','middle')
    .attr('x',l=>proj(l.c)[0]).attr('y',l=>proj(l.c)[1]+4).text(l=>l.n==='United States of America'?'United States':l.n);
}
function recolour(){gC.selectAll('path').attr('fill',f=>colourOf(data.get(f.properties.name)))}
function zoomBy(k,anim=true){
  const s0=proj.scale(), s1=Math.max(base*.8,Math.min(base*7,s0*k));
  if(!anim){proj.scale(s1);draw();return}
  d3.transition().duration(350).tween('z',()=>t=>{proj.scale(s0+(s1-s0)*t);draw()});
}
function flyToPoint(c,scaleK){
  const r0=proj.rotate(); let lon=-c[0]; while(lon-r0[0]>180)lon-=360; while(lon-r0[0]<-180)lon+=360;
  const r1=[lon,-c[1],0], s0=proj.scale(), s1=base*scaleK, ir=d3.interpolate(r0,r1);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  return new Promise(res=>{
    if(reduce){proj.rotate(r1).scale(s1);draw();return res()}
    d3.transition().duration(1150).ease(d3.easeCubicInOut).tween('fly',()=>t=>{
      proj.rotate(ir(t)); const mid=Math.min(s0,s1)*.92; const s=t<.5?s0+(mid-s0)*t*2:mid+(s1-mid)*(t-.5)*2; proj.scale(s); draw();
    }).on('end',res);
  });
}
function flyToCountry(n){
  const f=data.get(n).feature, ang=Math.sqrt(d3.geoArea(f)/Math.PI);
  return flyToPoint(d3.geoCentroid(f), Math.max(1,Math.min(4.2,.42/ang)));
}

/* ---------- strata (declared vs observed, gap hatched) ---------- */
function strata(d,o,max,{h=16,labels=true,w=380}={}){
  const x=v=>Math.max(0,v/max*(w-2)), lw=labels?0:0, gapPos=o>=d;
  const y1=labels?16:0, y2=y1+h+3, H=y2+h+(labels?18:0);
  const lo=Math.min(d,o), hi=Math.max(d,o);
  return `<svg class="strata" viewBox="0 0 ${w} ${H}" role="img" aria-label="Declared ${fmtMt(d)} Mt, observed ${fmtMt(o)} Mt">
    ${labels?`<text class="lbl" x="0" y="11">Declared</text><text x="${x(d)}" y="11" text-anchor="end">${fmtMt(d)} Mt</text>`:''}
    <rect x="1" y="${y1}" width="${x(d)}" height="${h}" fill="var(--g0)" stroke="var(--ink)" stroke-width="1"/>
    ${!gapPos?`<rect x="${1+x(o)}" y="${y1}" width="${x(d)-x(o)}" height="${h}" fill="url(#hatch-neg)" stroke="var(--ok)" stroke-width="1"/>`:''}
    <rect x="1" y="${y2}" width="${x(o)}" height="${h}" fill="var(--sea)" stroke="var(--ink)" stroke-width="1"/>
    ${gapPos?`<rect x="${1+x(d)}" y="${y2}" width="${Math.max(1.5,x(o)-x(d))}" height="${h}" fill="url(#hatch-gap)" stroke="var(--crit)" stroke-width="1"/>`:''}
    <line x1="${1+x(d)}" x2="${1+x(d)}" y1="${y1-3}" y2="${y2+h+3}" stroke="var(--ink)" stroke-dasharray="2 2"/>
    ${labels?`<text class="lbl" x="0" y="${y2+h+14}">Observed</text><text x="${x(o)}" y="${y2+h+14}" text-anchor="end">${fmtMt(o)} Mt</text>`:''}
  </svg>`;
}
function confTag(c){return `<span class="cf"><svg class="sw" viewBox="0 0 12 10"><rect width="12" height="10" fill="var(--sheet)"/>${c==='low'?'<rect width="12" height="10" fill="url(#hatch-conf)"/>':c==='medium'?'<rect width="6" height="10" fill="var(--ink-3)"/>':'<rect width="12" height="10" fill="var(--ink-2)"/>'}</svg>${confLabel(c)}</span>`}

/* ---------- right sheet ---------- */
function renderWorld(){
  const rows=[...data.values()].map(r=>({r,a:agg(r)})).filter(x=>x.a.d>20).sort((a,b)=>b.a.gap-a.a.gap);
  const D=d3.sum(rows,x=>x.a.d), O=d3.sum(rows,x=>x.a.o);
  $('#sheet').innerHTML=`
    <div class="sheet-head"><div class="crumb">Inventory year ${state.year}</div><h2>World</h2>
      <div class="meta"><span>${rows.length} countries above 20 MtCO₂e</span><span>Carbon price €${PRICE}/t</span></div></div>
    <div class="block"><h3>Declared vs observed</h3>${strata(D,O,Math.max(D,O))}
      <dl class="figs"><div><dt>Declared</dt><dd>${fmtMt(D/1000)} <small>Gt</small></dd></div><div><dt>Observed</dt><dd>${fmtMt(O/1000)} <small>Gt</small></dd></div>
      <div class="gap"><dt>Gap</dt><dd>${fmtPct((O-D)/D)}</dd></div><div class="gap"><dt>At €${PRICE}/t</dt><dd>${fmtEur(O-D)}</dd></div></dl></div>
    <div class="block"><h3>Largest gaps</h3>
      <table><thead><tr><th>Country</th><th>Declared</th><th>Observed</th><th>Gap</th><th>Value</th></tr></thead>
      <tbody>${rows.slice(0,14).map(({r,a})=>`<tr data-c="${r.name}"><td>${r.name==='United States of America'?'United States':r.name}<span class="sub">${confTag(r.conf)}</span></td><td>${fmtMt(a.d)}</td><td>${fmtMt(a.o)}</td><td class="${a.gap>=0?'gpos':'gneg'}">${fmtPct(a.pct)}</td><td>${fmtEur(a.gap)}</td></tr>`).join('')}</tbody></table>
      <p class="lede" style="margin-top:10px">Select a country on the globe or in this table to see the sectors and sites behind its gap.</p></div>`;
  $('#sheet').querySelectorAll('tr[data-c]').forEach(tr=>tr.onclick=()=>selectCountry(tr.dataset.c,{fly:true}));
}
function renderCountry(n){
  const rec=data.get(n), a=agg(rec), sites=sitesOf(rec);
  const secs=rec.sectors.filter(s=>state.sectors.has(s.id)).map(s=>({...s,d:s.declared*YEAR_F[state.year],o:s.observed*YEAR_F[state.year]}));
  const smax=d3.max(secs,s=>Math.max(s.d,s.o))||1;
  const k=state.sort.key, dir=state.sort.dir;
  const list=sites.filter(s=>state.sectors.has(s.sector)).map(s=>({s,v:siteVals(s)}))
    .sort((x,y)=>dir*((k==='name'?x.s.name.localeCompare(y.s.name):0)||(x.v[k]-y.v[k])));
  const th=(key,label)=>`<th><button data-sort="${key}" ${k===key?`aria-sort="${dir>0?'ascending':'descending'}"`:''}>${label}</button></th>`;
  const disp=n==='United States of America'?'United States':n;
  $('#sheet').innerHTML=`
    <div class="sheet-head"><div class="crumb"><button id="back">World</button><span>/</span><span>${disp}</span></div><h2>${disp}</h2>
      <div class="meta"><span>Inventory year ${state.year}</span><span class="pill">Confidence ${confTag(rec.conf)}</span><span>${sites.length} large sites tracked</span></div></div>
    <div class="block"><h3>Declared vs observed</h3>${strata(a.d,a.o,Math.max(a.d,a.o))}
      <dl class="figs"><div><dt>Declared</dt><dd>${fmtMt(a.d)} <small>Mt</small></dd></div><div><dt>Observed</dt><dd>${fmtMt(a.o)} <small>Mt</small></dd></div>
      <div class="gap"><dt>Gap</dt><dd>${fmtMt(a.gap)} <small>Mt · ${fmtPct(a.pct)}</small></dd></div><div class="gap"><dt>At €${PRICE}/t</dt><dd>${fmtEur(a.gap)}</dd></div></dl></div>
    <div class="block"><h3>By sector</h3>${secs.map(s=>`<div class="secrow"><span class="n"><span class="sw" style="background:${SEC[s.id].color}"></span>${SEC[s.id].name}</span>${strata(s.d,s.o,smax,{h:7,labels:false,w:220})}<span class="v ${s.o>=s.d?'pos':'neg'}">${fmtPct((s.o-s.d)/s.d)}</span></div>`).join('')||'<p class="lede">No sector selected. Turn one on in the left panel.</p>'}</div>
    <div class="block"><h3>Sites behind the gap</h3>
      ${list.length?`<table><thead><tr>${th('name','Site')}${th('d','Declared')}${th('o','Observed')}${th('gap','Gap')}</tr></thead>
      <tbody>${list.map(({s,v})=>`<tr data-s="${s.id}" class="${s.id===state.activeSite?'on':''}"><td><span class="secdot" style="background:${SEC[s.sector].color}"></span>${s.name}<span class="sub">${s.operator} · ${confTag(s.conf)}</span></td><td>${fmtMt(v.d)}</td><td>${fmtMt(v.o)}</td><td class="${v.gap>=0?'gpos':'gneg'}">${fmtPct(v.pct)}</td></tr>`).join('')}</tbody></table>`
      :'<p class="lede">No tracked sites in the selected sectors.</p>'}</div>
    <div class="block"><h3>Sources</h3><ul class="sources">${SOURCES.map(([s,f])=>`<li><span>${s}</span><span>${f}</span></li>`).join('')}</ul>
      <p class="lede" style="margin-top:10px">A gap is a lead to investigate, not proof of misreporting.</p></div>
    <div class="actions"><button class="btn" id="mkreport"><i data-lucide="file-text" class="icon"></i>Generate report</button><button class="btn ghost" id="askwhy"><i data-lucide="message-square-text" class="icon"></i>Ask why</button></div>`;
  $('#back').onclick=()=>clearSelection();
  $('#mkreport').onclick=()=>openReport(n);
  $('#askwhy').onclick=()=>ask(`Why is ${disp}'s gap ${a.gap>=0?'so high':'negative'}?`);
  $('#sheet').querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{const key=b.dataset.sort;state.sort={key,dir:state.sort.key===key?-state.sort.dir:(key==='name'?1:-1)};renderCountry(n)});
  $('#sheet').querySelectorAll('tr[data-s]').forEach(tr=>tr.onclick=()=>focusSite(tr.dataset.s));
  icons();
}
function renderSheet(){state.selected?renderCountry(state.selected):renderWorld()}

async function selectCountry(n,{fly=false}={}){
  if(!data.has(n)) return;
  state.selected=n; state.activeSite=null; state.siteLayer=sitesOf(data.get(n));
  renderSheet(); draw(); history.replaceState(null,'','#'+encodeURIComponent(n));
  if(fly) await flyToCountry(n);
}
function clearSelection(){state.selected=null;state.siteLayer=null;state.activeSite=null;state.highlight.clear();renderSheet();draw();history.replaceState(null,'',location.pathname);flyToPoint([12,38],1)}
function focusSite(id){
  const s=(state.siteLayer||[]).find(x=>x.id===id); if(!s) return;
  if(state.selected!==s.country){state.selected=s.country;}
  state.activeSite=id; renderSheet(); draw(); flyToPoint(s.coord,Math.max(proj.scale()/base,3));
  const tr=$(`tr[data-s="${CSS.escape(id)}"]`); tr&&tr.scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* ---------- report ---------- */
async function openReport(n){
  const rec=data.get(n), a=agg(rec), disp=n==='United States of America'?'United States':n;
  const el=$('#report'); el.classList.add('open');
  const steps=['Collecting declared inventories','Matching sites across 5 sources','Reconciling declared vs observed','Writing the summary','Checking every figure has a source'];
  el.innerHTML=`<div class="report-tools"><span class="t">Report · ${disp}</span><button class="btn ghost" id="rclose"><i data-lucide="x" class="icon"></i>Close</button></div><ol class="steps">${steps.map(s=>`<li><span class="dot"></span>${s}</li>`).join('')}</ol>`;
  icons(); $('#rclose').onclick=closeReport;
  const lis=el.querySelectorAll('.steps li');
  for(let i=0;i<lis.length;i++){lis[i].classList.add('now');await sleep(window.REPORT_STEP_MS||420);lis[i].classList.replace('now','done')}
  if(!el.classList.contains('open')) return;
  const sites=sitesOf(rec).map(s=>({s,v:siteVals(s)})).sort((x,y)=>y.v.gap-x.v.gap);
  const secs=rec.sectors.map(s=>({...s,d:s.declared*YEAR_F[state.year],o:s.observed*YEAR_F[state.year]})).sort((x,y)=>(y.o-y.d)-(x.o-x.d));
  const top=secs[0], topSite=sites[0];
  const today=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  el.innerHTML=`<div class="report-tools"><span class="t">Report · ${disp}</span>
      <button class="btn ghost" id="rlink"><i data-lucide="link" class="icon"></i>Copy link</button>
      <button class="btn ghost" id="rprint"><i data-lucide="printer" class="icon"></i>Save as PDF</button>
      <button class="btn ghost" id="rclose"><i data-lucide="x" class="icon"></i>Close</button></div>
    <article class="doc">
      <div class="titleblock"><h1>Emissions gap dossier: ${disp}</h1><div class="tb-meta">Carbon Gap<br>Inventory year ${state.year}<br>Generated ${today}<br><b>Synthetic data</b></div></div>
      <h3>Summary</h3>
      <p>Independent estimates put ${disp}'s ${state.year} emissions at <b>${fmtMt(a.o)} MtCO₂e</b>, against <b>${fmtMt(a.d)} Mt</b> declared in its national inventory: a gap of <b>${fmtMt(a.gap)} Mt (${fmtPct(a.pct)})</b>, worth <b>${fmtEur(a.gap)}</b> at €${PRICE}/t.</p>
      <p>The largest contribution comes from <b>${SEC[top.id].name.toLowerCase()}</b> (${fmtPct((top.o-top.d)/top.d)} above declared). The single site with the widest gap is <b>${topSite.s.name}</b>, operated by ${topSite.s.operator}, observed at ${fmtMt(topSite.v.o)} Mt against ${fmtMt(topSite.v.d)} Mt declared.</p>
      <div class="callout">Confidence in the observed estimate: <b>${confLabel(rec.conf)}</b>. A gap is a lead to investigate, not proof of misreporting. Differences can come from emission factors, reporting scope or the timing of data.</div>
      <h3>Declared vs observed</h3>${strata(a.d,a.o,Math.max(a.d,a.o),{h:22,w:700})}
      <h3>By sector</h3>
      <table><thead><tr><th>Sector</th><th>Declared, Mt</th><th>Observed, Mt</th><th>Gap</th><th>Value</th></tr></thead>
      <tbody>${secs.map(s=>`<tr><td><span class="secdot" style="background:${SEC[s.id].color}"></span>${SEC[s.id].name}</td><td>${fmtMt(s.d)}</td><td>${fmtMt(s.o)}</td><td class="${s.o>=s.d?'gpos':'gneg'}">${fmtPct((s.o-s.d)/s.d)}</td><td>${fmtEur(s.o-s.d)}</td></tr>`).join('')}</tbody></table>
      <h3>Sites to investigate</h3>
      <table><thead><tr><th>Site</th><th>Operator</th><th>Declared</th><th>Observed</th><th>Gap</th></tr></thead>
      <tbody>${sites.slice(0,6).map(({s,v})=>`<tr><td>${s.name}</td><td style="text-align:left">${s.operator}</td><td>${fmtMt(v.d)}</td><td>${fmtMt(v.o)}</td><td class="${v.gap>=0?'gpos':'gneg'}">${fmtPct(v.pct)}</td></tr>`).join('')}</tbody></table>
      <h3>Recommended next steps</h3>
      <ol><li>Request the monitoring plan and verification report for ${topSite.s.name}.</li><li>Compare ${SEC[top.id].name.toLowerCase()} activity data (fuel, output) with the emission factors used in the inventory.</li><li>Re-run this dossier when the next satellite month is available.</li></ol>
      <h3>Sources and method</h3>
      <ul class="sources">${SOURCES.map(([s,f])=>`<li><span>${s}</span><span>${f}</span></li>`).join('')}</ul>
      <p style="margin-top:12px;font-size:13px;color:var(--ink-3)">Mockup: every figure, site and operator in this report is invented.</p>
    </article>`;
  icons();
  $('#rclose').onclick=closeReport; $('#rprint').onclick=()=>window.print();
  $('#rlink').onclick=()=>{navigator.clipboard?.writeText(location.href.split('#')[0]+'#'+encodeURIComponent(n)).then(()=>toast('Link copied'),()=>toast('Could not copy the link'))};
}
function closeReport(){const el=$('#report');el.classList.remove('open');el.innerHTML=''}

/* ---------- analyst (scripted for the mockup) ---------- */
const ALIASES={'usa':'United States of America','us':'United States of America','united states':'United States of America','america':'United States of America','uk':'United Kingdom','britain':'United Kingdom','korea':'South Korea'};
function findCountries(q){
  const l=' '+q.toLowerCase().replace(/[^a-z\s'-]/g,' ')+' ', found=[];
  for(const n of data.keys()){const ln=n.toLowerCase(); const i=l.indexOf(' '+ln); if(i>=0 && ln.length>3) found.push([i,n])}
  for(const [a,n] of Object.entries(ALIASES)){const i=l.indexOf(' '+a+' ');if(i>=0)found.push([i,n])}
  return [...new Map(found.sort((a,b)=>a[0]-b[0]).map(([i,n])=>[n,i])).keys()];
}
const log=$('#log');
function addMsg(role,html){const d=document.createElement('div');d.className='msg '+role;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function addTool(name,args){const d=document.createElement('div');d.className='tool';d.innerHTML=`<i data-lucide="map-pin" class="icon"></i><code>${name}</code> ${args}`;log.appendChild(d);icons();log.scrollTop=log.scrollHeight}
async function thinking(t,ms){const d=document.createElement('div');d.className='thinking';d.innerHTML=`<i></i>${t}`;log.appendChild(d);log.scrollTop=log.scrollHeight;await sleep(ms);d.remove()}
async function stream(html){
  const d=addMsg('ai',''); const tmp=document.createElement('div'); tmp.innerHTML=html;
  const text=tmp.textContent; const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){for(let i=0;i<text.length;i+=6){d.textContent=text.slice(0,i);log.scrollTop=log.scrollHeight;await sleep(12)}}
  d.innerHTML=html; log.scrollTop=log.scrollHeight;
}
let busy=false;
async function ask(q){
  if(busy||!q.trim()) return; busy=true; $('#ask button').disabled=true;
  $('#analyst').classList.remove('min');
  addMsg('user',q.replace(/</g,'&lt;'));
  [...$('#sugg').children].forEach(b=>{if(b.textContent===q)b.remove()});
  try{ await answer(q) } finally { busy=false; $('#ask button').disabled=false; }
}
async function answer(q){
  const l=q.toLowerCase(), cs=findCountries(q);
  const rank=()=>[...data.values()].map(r=>({r,a:agg(r)})).filter(x=>x.a.d>50).sort((a,b)=>b.a.gap-a.a.gap);
  const disp=n=>n==='United States of America'?'United States':n;

  if(/report|dossier/.test(l)){
    const n=cs[0]||state.selected; if(!n){await stream('<p>Which country should the report cover? Select one on the globe or name it.</p>');return}
    await thinking('Planning the report',500); addTool('select_country',disp(n)); await selectCountry(n,{fly:true});
    addTool('generate_report',disp(n)); openReport(n);
    await stream(`<p>The dossier on ${disp(n)} is open: summary, sector and site tables, next steps and sources. You can save it as a PDF.</p>`); return;
  }
  if(/compare|versus|\bvs\b/.test(l) && cs.length>=2){
    const [a,b]=cs; await thinking('Pulling both inventories',600);
    addTool('highlight_countries',`${disp(a)}, ${disp(b)}`); state.highlight=new Set([a,b]);
    const ca=d3.geoCentroid(data.get(a).feature), cb=d3.geoCentroid(data.get(b).feature);
    await flyToPoint(d3.geoInterpolate(ca,cb)(.5),Math.max(1,Math.min(3.4,.55/d3.geoDistance(ca,cb))));
    const A=agg(data.get(a)),B=agg(data.get(b)); const hi=A.pct>B.pct?[a,A]:[b,B];
    await stream(`<p><b>${disp(a)}</b>: ${fmtMt(A.d)} Mt declared, ${fmtMt(A.o)} observed (${fmtPct(A.pct)}, ${fmtEur(A.gap)}).<br><b>${disp(b)}</b>: ${fmtMt(B.d)} Mt declared, ${fmtMt(B.o)} observed (${fmtPct(B.pct)}, ${fmtEur(B.gap)}).</p><p>${disp(hi[0])} has the larger relative gap. Open it to see which sites drive it.</p><p class="cite">Sources: national inventories, asset-level estimates · synthetic</p>`);
    return;
  }
  const sec=SECTORS.find(s=>l.includes(s.id)||l.includes(s.name.toLowerCase().split(' ')[0]))||(/refiner/.test(l)&&SEC.oil)||(/coal|power plant/.test(l)&&SEC.power);
  if(sec && /europe/.test(l)){
    const EU=['Germany','France','Poland','Italy','Spain','United Kingdom','Netherlands','Belgium','Czechia','Sweden','Norway','Ukraine'];
    await thinking(`Finding ${sec.name.toLowerCase()} sites in Europe`,700);
    addTool('set_layer',`sector = ${sec.name}`); state.sectors=new Set([sec.id]); syncSectorInputs(); recolour();
    const sites=EU.filter(n=>data.has(n)).flatMap(n=>sitesOf(data.get(n))).filter(s=>s.sector===sec.id);
    state.siteLayer=sites; state.selected=null; state.highlight=new Set(); renderSheet();
    addTool('fly_to','Europe'); await flyToPoint([12,50],2.6);
    const top=sites.map(s=>({s,v:siteVals(s)})).sort((a,b)=>b.v.gap-a.v.gap).slice(0,3);
    await stream(`<p>${sites.length} ${sec.name.toLowerCase()} sites are on the map. The widest gaps:</p><ol>${top.map(({s,v})=>`<li>${s.name}, ${s.country} (${fmtPct(v.pct)})</li>`).join('')}</ol><p class="cite">Sources: EU ETS verified emissions, asset-level estimates · synthetic</p>`);
    return;
  }
  if(/(biggest|largest|top|highest|most|worst).*(gap|under|differ)|under-?report|under-?declar/.test(l) || (/gap/.test(l)&&!cs.length)){
    await thinking('Ranking 170 countries',700);
    const top=rank().slice(0,5); addTool('highlight_countries',top.map(x=>disp(x.r.name)).join(', '));
    state.highlight=new Set(top.map(x=>x.r.name)); state.selected=null; state.siteLayer=null; renderSheet();
    addTool('fly_to',disp(top[0].r.name)); await flyToCountry(top[0].r.name); draw();
    await stream(`<p>Largest gaps in tonnes, ${state.year}:</p><ol>${top.map(({r,a})=>`<li>${disp(r.name)}: ${fmtMt(a.gap)} Mt (${fmtPct(a.pct)}), ${fmtEur(a.gap)}</li>`).join('')}</ol><p>In relative terms, ${disp(rank().filter(x=>x.a.d>100).sort((a,b)=>b.a.pct-a.a.pct)[0].r.name)} stands out. Ask me why, or open a country.</p><p class="cite">Sources: national inventories, asset-level estimates · synthetic</p>`);
    return;
  }
  if(cs.length){
    const n=cs[0], rec=data.get(n), a=agg(rec); await thinking(`Reading ${disp(n)}'s sources`,700);
    addTool('select_country',disp(n)); state.highlight=new Set(); await selectCountry(n,{fly:true});
    const secs=rec.sectors.map(s=>({s,g:s.observed-s.declared})).sort((x,y)=>y.g-x.g);
    const topSite=sitesOf(rec).map(s=>({s,v:siteVals(s)})).sort((x,y)=>y.v.gap-x.v.gap)[0];
    addTool('focus_site',topSite.s.name); state.activeSite=topSite.s.id; renderSheet(); draw();
    await stream(`<p>${disp(n)} declares ${fmtMt(a.d)} Mt and is observed at ${fmtMt(a.o)} Mt (${fmtPct(a.pct)}, ${fmtEur(a.gap)}).</p><p>Most of the gap sits in <b>${SEC[secs[0].s.id].name.toLowerCase()}</b> and <b>${SEC[secs[1].s.id].name.toLowerCase()}</b>. The largest single difference is ${topSite.s.name} (${topSite.s.operator}), highlighted on the map. Confidence is ${confLabel(rec.conf).toLowerCase()}.</p><p>Want a full dossier?</p><p class="cite">Sources: national inventory, EU ETS, Sentinel-5P · synthetic</p>`);
    return;
  }
  await stream(`<p>In this mockup I answer a few scripted questions. Try one of the suggestions below, or name a country.</p>`);
}
const SUGG=['Which countries have the biggest gap?','Show steel plants in Europe','Compare France and Germany','Why is Poland\'s gap so high?','Write a report on Poland'];

/* ---------- controls ---------- */
function syncSectorInputs(){document.querySelectorAll('#sectors input').forEach(i=>i.checked=state.sectors.has(i.value))}
function initControls(){
  $('#sectors').innerHTML=SECTORS.map(s=>`<label class="sector"><input type="checkbox" value="${s.id}" checked><span class="sw" style="background:${s.color}"></span><span class="name">${s.name}</span><span class="chk"></span></label>`).join('');
  $('#symbols').innerHTML=SECTORS.map(s=>`<div class="keyrow"><svg class="sw" viewBox="-9 -7 18 14" style="border:0"><path d="${d3.symbol(s.sym,50)()}" fill="${s.color}" stroke="#1C2320"/></svg>${s.noun}</div>`).join('');
  document.querySelectorAll('#sectors input').forEach(i=>i.onchange=()=>{i.checked?state.sectors.add(i.value):state.sectors.delete(i.value);recolour();renderSheet();draw()});
  document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{state.metric=b.dataset.metric;document.querySelectorAll('[data-metric]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderLegend();recolour()});
  $('#year').onchange=e=>{state.year=+e.target.value;recolour();renderSheet()};
  $('#zin').onclick=()=>zoomBy(1.4); $('#zout').onclick=()=>zoomBy(1/1.4); $('#zreset').onclick=()=>clearSelection();
  document.querySelectorAll('[data-soon]').forEach(b=>b.onclick=()=>toast('Not in the mockup yet'));
  $('#search').onchange=e=>{const v=e.target.value.trim();const n=[...data.keys()].find(k=>k.toLowerCase()===v.toLowerCase())||findCountries(v)[0];if(n){selectCountry(n,{fly:true});e.target.value=''}else toast('No country matches “'+v+'”')};
  $('#countries').innerHTML=[...data.keys()].sort().map(n=>`<option value="${n}">`).join('');
  $('#ask').onsubmit=e=>{e.preventDefault();const q=$('#q').value;$('#q').value='';ask(q)};
  $('#amin').onclick=()=>{const a=$('#analyst');a.classList.toggle('min');$('#amin').setAttribute('aria-label',a.classList.contains('min')?'Expand analyst':'Minimise analyst')};
  $('#sugg').innerHTML=SUGG.map(s=>`<button type="button">${s}</button>`).join('');
  $('#sugg').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent));
  addMsg('ai','<p>Ask me where declared emissions and observed emissions disagree. I can move the map, compare countries and write a sourced report.</p>');
  addEventListener('resize',()=>resize());
  addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#report').classList.contains('open'))closeReport()});
}

/* ---------- boot ---------- */
icons();
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo=>{
  const feats=topojson.feature(topo,topo.objects.countries).features.filter(f=>f.properties.name!=='Antarctica');
  buildData(feats); $('#stage-msg').remove();
  initControls(); renderLegend(); initGlobe(); renderSheet();
  const h=decodeURIComponent(location.hash.slice(1)); if(data.has(h)) selectCountry(h,{fly:true});
}).catch(()=>{$('#stage-msg').textContent='The map could not load. Check your connection, then reload the page.'});
</script>
</body>
</html>
